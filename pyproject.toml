[project]
name = "canvas-archive"
version = "0.1.0"
description = "Pulls Canvas LMS course material (assignment .md per group, optional handouts) into per-course private GitHub repos."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "canvasapi>=3.6.0",
    "markdownify>=1.2.2",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
canvas-archive = "canvas_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Mirrors canvasapi's real class names (CanvasException etc.), which we don't
# control, so this is exempt from our own naming/lint conventions.
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

# Type checker settings live in ``pyrightconfig.json`` (Pylance, basedpyright, and CLI pyright all read it).
