name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # No Canvas token, GitHub token, or Terraform state exists in CI. Every
        # test in tests/ covers pure logic (slug/markdown formatting, profile
        # loading, strategy dispatch) or mocks subprocess calls; nothing here
        # reaches the real Canvas API, GitHub, or Terraform.
        run: pytest -q
