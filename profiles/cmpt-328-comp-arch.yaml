canvas_id: 3596470
slug_kebab: cmpt-328-comp-arch
strategy: external_site

# UAT: docs/UAT-wave-202-306-328.md and docs/CMPT328-external-site-and-js-render.md

# Kathy hosts the actual problem prompts on her own server. The Canvas
# descriptions only contain submission rubrics, not the problems themselves.
#
# Kathy's pages render their tables, points, and answer slots via JavaScript
# at runtime, so plain wget (the default external_site mirror) only captures
# the JS-stub HTML. js_render_fallback tells the extractor to fetch each
# matched candidate URL through headless Chrome instead, once the wget mirror
# comes back empty. See extractors/external_site.py:_render_via_chrome.
external_site:
  base_url: https://cs.westminsteru.edu/~kathy/2026spring/cmpt328/
  js_render_fallback: true
  assignment_patterns:
    - regex: "^homework (\\d+\\.\\d+)$"
      candidates:
        - "homework{n}.html"
        - "homework{n}/index.html"
