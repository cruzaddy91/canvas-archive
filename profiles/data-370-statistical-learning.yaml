# Jingsai's course home, same bare-iframe shape as the other three. 2026-09-23
# read-only audit found this one's linking is the most mixed of the four: Colab
# notebooks, R markdown, plain HTML spec pages, and PDFs, no single dominant
# type. course_home_external_file_extensions below is deliberately broad to
# cover all of them rather than guessing which one dominates.
assignment_files_from_course_home_table: true
course_home_merge_syllabus_body: true

# See course_home_table.py:_row_text_context_enabled.
course_home_row_text_context: true

# 2026-09-23 audit finding: this course's calendar header reads
# "Labs/Homework/Project", never the word "assignment", so column
# auto-detection matches nothing at all (confirmed: 0 rows found before this
# was added). See course_home_table.py:_assignments_column_index.
course_home_assignments_column_header: "Labs/Homework/Project"

course_home_supplement_html_urls:
  - https://cs.westminstercollege.edu/~jingsai/courses/DATA370/calendar_dyn

course_home_external_file_extensions:
  - .ipynb
  - .py
  - .zip
  - .htm
  - .html
  - .pdf
  - .rmd

course_home_external_download_hosts:
  - cs.westminstercollege.edu
  - cs.westminsteru.edu

course_home_follow_links_in_external_html: true
course_home_external_html_follow_extensions:
  - .zip
  - .ipynb
  - .py
  - .pdf
  - .rmd

developer_mode: true

download_linked_canvas_files: true
refetch_assignment_description: true
