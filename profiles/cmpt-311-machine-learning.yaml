canvas_id: 3572079
slug_kebab: cmpt-311-machine-learning
strategy: canvas_only

# Same shape as cmpt-301-artificial-intelligence: Jingsai's course home is a bare
# iframe wrapping a personal calendar page, not a real front page. Read-only audit
# (2026-09-23) confirmed the calendar itself is rich: a 28-week table, each
# assignment linking out to a spec page or file, not sitting in the Canvas
# description (which the API returns as empty for these).
assignment_files_from_course_home_table: true
course_home_merge_syllabus_body: true

# Some rows (Activities in particular) have nothing linkable at all, real
# content is the row's own Topics/Materials text. See
# course_home_table.py:_row_text_context_enabled.
course_home_row_text_context: true

course_home_supplement_html_urls:
  - https://cs.westminsteru.edu/~jingsai/courses/CMPT311/calendar_dyn

course_home_external_file_extensions:
  - .ipynb
  - .py
  - .zip
  - .htm
  - .html
  - .pdf

course_home_external_download_hosts:
  - cs.westminsteru.edu
  - cs.westminstercollege.edu

course_home_follow_links_in_external_html: true
course_home_external_html_follow_extensions:
  - .zip
  - .ipynb
  - .py
  - .pdf

# Relaxed for the first pass. Set false once a run confirms only the two hosts
# above are ever linked from the schedule table.
developer_mode: true

download_linked_canvas_files: true
refetch_assignment_description: true
module_files_before_assignment: true
module_file_lookback_items: 20
module_files_max_per_assignment: 15

prune_orphan_canvas_files: true
